<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pena News – Suara Fakta Anda!</title>
<style>
:root{--bg:#fff;--soft:#fff8d6;--ink:#17150e;--mute:#6a654d;--line:#ebe5c4;--y:#ffc400;--card:#fff;--dng:#c62828;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0d09;--soft:#1c1a10;--ink:#f5f2e3;--mute:#aaa48a;--line:#2d2b1d;--y:#ffd21f;--card:#161510;--dng:#ff7a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0d09;--soft:#1c1a10;--ink:#f5f2e3;--mute:#aaa48a;--line:#2d2b1d;--y:#ffd21f;--card:#161510;--dng:#ff7a7a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);box-shadow:0 0 0 4px var(--y)}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.25;margin:0}
.dt{font-size:13px;color:var(--mute);padding:6px 16px 0;font-variant-numeric:tabular-nums}.dt b{color:var(--ink)}
.top{display:flex;align-items:center;gap:8px;padding:8px 16px 12px}
.brand{display:flex;gap:10px;align-items:center;flex:1;min-width:0}
.brand img{width:50px;height:50px;border-radius:10px;flex:none}
.brand b{display:block;font:700 24px/1 Georgia,serif}
.brand small{display:block;color:var(--mute);font-size:12.5px;margin-top:3px}
.ib{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 11px;font-size:14px;font-weight:600}
.sr{padding:0 16px 12px}
.sr input,dialog input,dialog select,dialog textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
header{border-bottom:4px solid var(--y)}
.nv{display:flex;gap:2px;overflow-x:auto;padding:0 10px;border-bottom:1px solid var(--line)}
.nv button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 13px;font-weight:600;white-space:nowrap}
.nv button.on{border-color:var(--y)}
main{max-width:1080px;margin:0 auto;padding:0 16px 20px}
.btn{background:var(--y);color:#1a1500;border:0;border-radius:8px;padding:9px 14px;font-weight:700}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.lk{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-decoration-color:var(--y);text-decoration-thickness:2px;text-underline-offset:3px;font-size:14px}
.abar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);border:1px dashed var(--y);padding:8px 12px;border-radius:8px;margin-top:14px;font-size:14px}
.tk{display:flex;align-items:center;margin-top:14px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--soft)}
.tk b{background:var(--y);color:#1a1500;padding:10px 12px;font-size:13px;letter-spacing:.04em;flex:none;display:flex;align-items:center;gap:7px}
.live{width:9px;height:9px;border-radius:50%;background:#e11d1d;box-shadow:0 0 0 2px #fff;animation:bl 1.1s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.15}}
@media(prefers-reduced-motion:reduce){.live{animation:none}}
.tw{overflow:hidden;flex:1}
.tt{display:inline-flex;white-space:nowrap;animation:mq 50s linear infinite}
.tt:hover{animation-play-state:paused}
.tt button{background:none;border:0;padding:0;font-size:14.5px}
.tt button::after{content:"●";color:var(--y);margin:0 18px;font-size:10px}
@keyframes mq{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.tt{animation:none}.tw{overflow-x:auto}.slide{transition:none!important}}
.Nasional{--g:linear-gradient(135deg,#ffc400,#ff9a00)}
.Dunia{--g:linear-gradient(135deg,#3a372a,#6b6340)}
.Sukan{--g:linear-gradient(135deg,#fff0a8,#ffd23d)}
.th,.mini,.slide{background:var(--g)}
.th img,.mini img,.th svg,.mini svg{width:100%;height:100%;object-fit:cover;display:block}
.slide>img,.slide>svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;display:block;margin:0 0 16px}
.prev{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.prev img{width:96px;height:64px;object-fit:cover;border-radius:6px}
.tag{display:inline-block;background:var(--y);color:#1a1500;font:700 12px system-ui;padding:2px 8px;border-radius:4px}
.hero{position:relative;overflow:hidden;border-radius:12px;margin:14px 0;aspect-ratio:16/9;min-height:240px;max-height:430px;touch-action:pan-y}
@media(max-width:640px){.hero{margin:12px -16px;border-radius:0;aspect-ratio:auto;height:min(68vh,560px);height:min(68svh,560px);min-height:0;max-height:none}.sc{padding:64px 18px 40px}.sc h2{font-size:24px}}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .5s;cursor:pointer;display:flex;align-items:flex-end;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.sc{position:relative;z-index:1;width:100%;padding:48px 18px 36px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff}
.sc h2{font-size:clamp(19px,4.5vw,30px);margin:8px 0 4px}
.sc p{margin:0;font-size:14px;opacity:.92;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.big{position:absolute;right:6%;top:10%;font-size:min(22vw,120px);font-style:normal;opacity:.4}
.nav{position:absolute;top:42%;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:22px;line-height:1}
.nav.p{left:8px}.nav.n{right:8px}
.dots{position:absolute;bottom:10px;right:14px;z-index:2;display:flex;gap:7px}
.dots button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.55)}
.dots button.on{background:var(--y);width:22px;border-radius:6px}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 12px;border-left:5px solid var(--y);padding-left:10px}
.sh h2,.ph{font-size:22px}
.ph{margin:22px 0 14px;border-left:5px solid var(--y);padding-left:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.th{aspect-ratio:16/9;display:grid;place-items:center;font-size:40px}
.cb{padding:12px 14px 14px}
.card h3,.row h3{font-size:17px;margin:8px 0 6px}
.meta{margin:0;font-size:12.5px;color:var(--mute);display:flex;gap:10px;flex-wrap:wrap}
.row{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.mini{flex:none;width:96px;height:76px;border-radius:8px;display:grid;place-items:center;font-size:28px}
.row h3{font-size:16px;margin:6px 0 4px}
.more{display:block;margin:18px auto 0}
.ad{display:flex;gap:8px;margin-top:8px}
.ad button{font-size:13px;padding:4px 10px;border:1px solid var(--line);background:var(--bg);border-radius:6px}
.ad .dng{color:var(--dng);border-color:var(--dng)}
.art{max-width:720px;margin:18px auto 0}
.art h1{font-size:clamp(25px,6vw,34px);margin:12px 0 8px}
.art p{font-size:17px;line-height:1.75;margin:0 0 16px}
.art .meta{margin-bottom:14px}.art .lead{font-weight:600;color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:20px;width:min(92vw,460px)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h2{font-size:21px;margin-bottom:12px}
dialog label{display:block;font-size:14px;font-weight:600;margin-bottom:10px}
dialog label input,dialog label select,dialog label textarea{margin-top:4px;font-weight:400}
dialog label.ck{display:flex;gap:8px;align-items:center}dialog label.ck input{width:auto;margin:0}
.err{color:var(--dng);font-size:14px;margin:0 0 8px;min-height:1em}
.acts{display:flex;justify-content:flex-end;gap:8px}
footer{margin-top:24px;border-top:4px solid var(--y);padding:22px 16px;text-align:center;color:var(--mute);font-size:14px}
footer img{width:72px;height:72px;border-radius:14px}
.fl{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.fl button{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.cp{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
footer p{margin:6px 0 0}
</style>
</head>

{id:'s1',c:'Nasional',f:1,d:'2026-11-07T09:00',a:'Sidang Pena',t:'Program bantuan sekolah dilancar untuk 500 buah sekolah luar bandar',s:'Peringkat awal merangkumi capaian internet, buku rujukan dan peralatan makmal.',b:'Program ini dirangka untuk merapatkan jurang kemudahan antara sekolah bandar dan luar bandar. Peringkat pertama memberi tumpuan kepada capaian internet, bahan bacaan dan peralatan asas makmal sains.\n\nPelaksanaan akan dipantau setiap suku tahun dan laporan kemajuan dikongsi kepada orang awam.'},
{id:'s2',c:'Dunia',f:1,d:'2026-11-07T07:30',a:'Sidang Pena',t:'Sidang kemuncak serantau bincang peralihan kepada tenaga boleh baharu',s:'Pemimpin menekankan kerjasama merentas sempadan dalam pembiayaan projek hijau.',b:'Wakil dari beberapa negara berkumpul untuk membincangkan jadual peralihan tenaga bersih. Tumpuan utama ialah pembiayaan, pemindahan teknologi dan latihan tenaga kerja.\n\nPerbincangan akan diteruskan pada sesi berikutnya bulan depan.'},
{id:'s3',c:'Sukan',f:1,d:'2026-11-06T21:15',a:'Sidang Pena',t:'Pasukan bola sepak tempatan bersedia hadapi aksi separuh akhir',s:'Jurulatih mengesahkan sebahagian besar pemain utama telah pulih sepenuhnya.',b:'Latihan terakhir diadakan secara tertutup bagi memastikan strategi tidak terdedah. Jurulatih berkata pasukan berada dalam keadaan semangat yang baik.\n\nPerlawanan dijadualkan berlangsung hujung minggu ini dan tiket dilaporkan hampir habis dijual.'},
{id:'s4',c:'Nasional',f:1,d:'2026-11-06T16:40',a:'Sidang Pena',t:'Lebuh raya baharu dijangka kurangkan kesesakan hujung minggu',s:'Projek siap lebih awal daripada jadual dan akan dibuka secara berperingkat.',b:'Laluan baharu ini menghubungkan dua kawasan padat penduduk dan dijangka memendekkan masa perjalanan dengan ketara. Pengguna dinasihatkan merujuk papan tanda sementara di sepanjang laluan.\n\nPihak pengurusan akan memantau aliran trafik pada minggu pertama operasi.'},
{id:'s5',c:'Sukan',f:1,d:'2026-11-05T19:00',a:'Sidang Pena',t:'Atlet remaja pecah rekod kebangsaan renang 100 meter',s:'Pencapaian dicatat dalam kejohanan peringkat negeri pada hujung minggu lalu.',b:'Perenang berusia 17 tahun itu menewaskan rekod lama dengan selisih lebih sedikit daripada sesaat. Jurulatihnya menyifatkan hasil itu buah usaha latihan konsisten selama dua tahun.\n\nBeliau bakal mewakili negara pada kejohanan serantau tahun depan.'},

let A;try{A=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!Array.isArray(A))A=SEED.map(x=>({...x}));
let S={view:'home',cat:'',q:'',id:'',slide:0,n:6,admin:false,edit:'',prev:{view:'home',cat:'',q:''},hov:false};
try{S.admin=sessionStorage.getItem('pena-admin')=='1'}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(A));return true}catch(e){return false}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TZ='Asia/Kuala_Lumpur';
const fmt=d=>new Date(d).toLocaleDateString('ms-MY',{day:'numeric',month:'long',year:'numeric'})+(d.length>10?', '+d.slice(11,16):'');
function klNow(){const p={};new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).forEach(x=>p[x.type]=x.value);return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`}
const sorted=()=>[...A].sort((x,y)=>y.d.localeCompare(x.d));
const ART={Nasional:'<g fill="rgba(0,0,0,.2)"><rect x="30" y="120" width="50" height="105"/><rect x="90" y="75" width="60" height="150"/><rect x="160" y="115" width="45" height="110"/><rect x="215" y="45" width="75" height="180"/><rect x="300" y="95" width="60" height="130"/></g><g fill="rgba(255,255,255,.6)"><rect x="105" y="95" width="12" height="12"/><rect x="125" y="95" width="12" height="12"/><rect x="235" y="70" width="14" height="14"/><rect x="258" y="70" width="14" height="14"/><rect x="235" y="100" width="14" height="14"/><rect x="258" y="100" width="14" height="14"/></g>',Dunia:'<g fill="none" stroke="rgba(255,255,255,.55)" stroke-width="3"><circle cx="200" cy="112" r="85"/><ellipse cx="200" cy="112" rx="40" ry="85"/><path d="M115 112h170M135 65h130M135 160h130"/></g>',Sukan:'<g fill="none" stroke="rgba(0,0,0,.28)" stroke-width="3"><rect x="40" y="30" width="320" height="165"/><path d="M200 30v165"/><circle cx="200" cy="112" r="36"/></g><circle cx="200" cy="112" r="12" fill="rgba(0,0,0,.35)"/>'};
const art=c=>`<svg viewBox="0 0 400 225" preserveAspectRatio="${c=='Nasional'?'xMidYMax slice':'xMidYMid meet'}" aria-hidden="true">${ART[c]||''}</svg>`;
const pic=a=>a.i?`<img src="${a.i}" alt="${esc(a.t)}" loading="lazy">`:art(a.c);
const adm=a=>S.admin?`<div class="ad"><button data-edit="${a.id}">Edit</button><button class="dng" data-del="${a.id}">Padam</button></div>`:'';
const meta=a=>`<p class="meta"><span>${esc(a.a)}</span><span>Diterbitkan ${fmt(a.d)}</span></p>`;
const card=a=>`<article class="card" data-id="${a.id}"><div class="th ${a.c}">${pic(a)}</div><div class="cb"><span class="tag">${a.c}</span><h3>${esc(a.t)}</h3>${meta(a)}${adm(a)}</div></article>`;
const row=a=>`<article class="row" data-id="${a.id}"><div class="mini ${a.c}">${pic(a)}</div><div><span class="tag">${a.c}</span><h3>${esc(a.t)}</h3>${meta(a)}${adm(a)}</div></article>`;
const feat=()=>{const f=sorted().filter(a=>a.f);return f.length?f:sorted().slice(0,5)};
const ticker=()=>{const h=feat().map(a=>`<button data-id="${a.id}">${esc(a.t)}</button>`).join('');return h?`<div class="tk"><b><i class="live" aria-hidden="true"></i>TERKINI</b><div class="tw"><div class="tt">${h}${h}</div></div></div>`:''};
function slider(){const f=sorted().filter(a=>a.f);if(!f.length)return'';if(S.slide>=f.length)S.slide=0;
return `<section class="hero" aria-label="Berita pilihan">${f.map((a,i)=>`<div class="slide ${a.c}${i==S.slide?' on':''}" data-id="${a.id}">${pic(a)}<div class="sc"><span class="tag">${a.c}</span><h2>${esc(a.t)}</h2><p>${esc(a.s)}</p></div></div>`).join('')}<button class="nav p" data-go="-1" aria-label="Sebelum">‹</button><button class="nav n" data-go="1" aria-label="Seterusnya">›</button><div class="dots">${f.map((_,i)=>`<button data-dot="${i}" class="${i==S.slide?'on':''}" aria-label="Slaid ${i+1}"></button>`).join('')}</div></section>`}
const sect=c=>{const l=sorted().filter(a=>a.c==c).slice(0,3);return l.length?`<section><div class="sh"><h2>${c}</h2><button class="lk" data-cat="${c}">Lihat semua</button></div><div class="grid">${l.map(card).join('')}</div></section>`:''};
const latest=()=>{const l=sorted();return l.length?`<section><div class="sh"><h2>Berita semasa</h2></div>${l.slice(0,S.n).map(row).join('')}${S.n<l.length?'<button class="btn more" data-more>Muat lagi</button>':''}</section>`:'<p class="empty">Belum ada artikel.</p>'};
const head=t=>`<h1 class="ph">${t}</h1>`;
const empty=t=>`<p class="empty">${t}</p>`;
const article=a=>`<div class="art"><button class="lk" data-back>← Kembali</button><div style="margin-top:14px"><span class="tag">${a.c}</span></div><h1>${esc(a.t)}</h1>${meta(a)}${a.i?`<img class="cover" src="${a.i}" alt="${esc(a.t)}">`:''}<p class="lead">${esc(a.s)}</p>${a.b.split(/\n\n+/).map(p=>`<p>${esc(p)}</p>`).join('')}${adm(a)}</div>`;
function render(keep){
 let h='';
 if(S.admin)h+=`<div class="abar"><span>Mod admin aktif</span><button class="btn" data-new>+ Tambah artikel</button></div>`;
 if(S.view=='home')h+=ticker()+slider()+CATS.map(sect).join('')+latest();
 else if(S.view=='cat'){const l=S.cat=='Terkini'?sorted():sorted().filter(a=>a.c==S.cat);h+=head(S.cat)+(l.length?`<div class="grid">${l.map(card).join('')}</div>`:empty('Belum ada artikel dalam kategori ini.'))}
 else if(S.view=='search'){const q=S.q.toLowerCase(),l=sorted().filter(a=>(a.t+' '+a.s+' '+a.b+' '+a.c).toLowerCase().includes(q));h+=head(`${l.length} hasil untuk “${esc(S.q)}”`)+(l.length?`<div class="grid">${l.map(card).join('')}</div>`:empty('Tiada artikel sepadan. Cuba kata kunci lain.'))}
 else{const a=A.find(x=>x.id==S.id);h+=a?article(a):empty('Artikel tidak ditemui.')}
 $('#main').innerHTML=h;
 $$('.nv button').forEach(b=>b.classList.toggle('on',(S.view=='home'&&b.dataset.nav=='Utama')||(S.view=='cat'&&b.dataset.nav==S.cat)));
 $('#lo').hidden=!S.admin;$('#li').hidden=S.admin;
 if(!keep)scrollTo(0,0);
}
function go(d){const s=$$('.slide');if(!s.length)return;S.slide=(S.slide+d+s.length)%s.length;s.forEach((x,i)=>x.classList.toggle('on',i==S.slide));$$('.dots button').forEach((x,i)=>x.classList.toggle('on',i==S.slide))}
setInterval(()=>{if(!S.hov&&!document.hidden)go(1)},5500);
document.addEventListener('mouseover',e=>{S.hov=!!e.target.closest('.hero')});
let tx=null;document.addEventListener('touchstart',e=>{tx=e.target.closest('.hero')?e.touches[0].clientX:null},{passive:true});
document.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40)go(dx<0?1:-1);tx=null});
function openEd(id){S.edit=id||'';const a=id?A.find(x=>x.id==id):{t:'',c:'Nasional',a:'',s:'',b:'',f:0};
 $('#et').value=a.t;$('#ec').value=a.c;$('#ea').value=a.a;$('#es').value=a.s;$('#eb').value=a.b;$('#ef').checked=!!a.f;
 EI=a.i||'';prevEI();$('#ei').value='';$('#eh').textContent=id?'Edit artikel':'Tambah artikel';$('#eerr').textContent='';$('#de').showModal()}
$('#esv').onclick=()=>{const t=$('#et').value.trim(),b=$('#eb').value.trim();
 if(!t||!b){$('#eerr').textContent='Isi tajuk dan isi artikel sebelum menyimpan.';return}
 const o={t,b,c:$('#ec').value,a:$('#ea').value.trim()||'Sidang Pena',s:$('#es').value.trim()||b.slice(0,140),f:$('#ef').checked?1:0,i:EI};
 const old=A;A=S.edit?A.map(x=>x.id==S.edit?{...x,...o}:x):[{id:'u'+Date.now(),d:klNow(),...o},...A];
 if(!persist()){A=old;$('#eerr').textContent='Storan penuh. Guna gambar lebih kecil atau padam artikel lama.';return}$('#de').close();render(true)};
let EI='';
function prevEI(){$('#ep').hidden=!EI;$('#epi').src=EI||''}
function shrink(f){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(f)})}
$('#ei').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{EI=await shrink(f);prevEI();$('#eerr').textContent=''}catch(x){$('#eerr').textContent='Gambar tidak dapat dibaca. Cuba fail JPG atau PNG.'}};
$('#erm').onclick=()=>{EI='';$('#ei').value='';prevEI()};
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
$('#lgo').onclick=async()=>{let ok=false;try{ok=(await sha($('#le').value.trim().toLowerCase()+'|'+$('#lp').value))===H}catch(e){}
 if(!ok){$('#lerr').textContent='E-mel atau kata laluan tidak betul.';return}
 S.admin=true;try{sessionStorage.setItem('pena-admin','1')}catch(e){}
 $('#dl').close();$('#lp').value='';render(true)};
$('#lp').addEventListener('keydown',e=>{if(e.key=='Enter')$('#lgo').click()});
$('#li').onclick=()=>{$('#lerr').textContent='';$('#dl').showModal()};
$('#lo').onclick=()=>{S.admin=false;try{sessionStorage.removeItem('pena-admin')}catch(e){}render(true)};
$('#q').addEventListener('input',e=>{S.q=e.target.value.trim();S.view=S.q?'search':'home';render(true)});
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-id]');if(!t)return;const d=t.dataset;
 if(d.close)t.closest('dialog').close();
 else if(d.nav){S.view=d.nav=='Utama'?'home':'cat';S.cat=d.nav;S.q='';$('#q').value='';render()}
 else if(d.cat){S.view='cat';S.cat=d.cat;render()}
 else if(d.edit)openEd(d.edit);
 else if(d.del){if(t.dataset.arm){A=A.filter(x=>x.id!=d.del);persist();if(S.view=='art'&&S.id==d.del)S=Object.assign(S,S.prev);render(true)}else{t.dataset.arm=1;t.textContent='Sahkan padam';setTimeout(()=>{delete t.dataset.arm;t.textContent='Padam'},3000)}}
 else if(d.new!==undefined)openEd();
 else if(d.more!==undefined){S.n+=6;render(true)}
 else if(d.go)go(+d.go);
 else if(d.dot)go(+d.dot-S.slide);
 else if(d.back!==undefined){Object.assign(S,S.prev);render()}
 else if(d.id){S.prev={view:S.view,cat:S.cat,q:S.q};S.view='art';S.id=d.id;render()}
});
const root=document.documentElement,dark=()=>root.dataset.theme?root.dataset.theme=='dark':matchMedia('(prefers-color-scheme: dark)').matches;
const icon=()=>{$('#th').textContent=dark()?'☀️ Cerah':'🌙 Gelap'};
try{const t=localStorage.getItem('pena-theme');if(t)root.dataset.theme=t}catch(e){}
$('#th').onclick=()=>{const n=dark()?'light':'dark';root.dataset.theme=n;try{localStorage.setItem('pena-theme',n)}catch(e){}icon()};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',icon);

const tick=()=>{const n=new Date();$('#dt').innerHTML=`${dF.format(n)} &nbsp;<b>${tF.format(n)}</b> MYT`};tick();setInterval(tick,1000);
icon();render(true);
})();
